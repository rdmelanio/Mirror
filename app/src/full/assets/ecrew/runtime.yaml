# Private, app-owned configuration read before Gecko starts (also in release builds).
env:
  MOZ_CRASHREPORTER_DISABLE: "1"
  MOZ_CRASHREPORTER_NO_REPORT: "1"
prefs:
  telemetry.fog.test.localhost_port: -1
  toolkit.telemetry.enabled: false
  toolkit.telemetry.unified: false
  toolkit.telemetry.archive.enabled: false
  toolkit.telemetry.server: ""
  toolkit.telemetry.newProfilePing.enabled: false
  toolkit.telemetry.shutdownPingSender.enabled: false
  toolkit.telemetry.updatePing.enabled: false
  toolkit.telemetry.bhrPing.enabled: false
  toolkit.telemetry.firstShutdownPing.enabled: false
  datareporting.healthreport.uploadEnabled: false
  datareporting.policy.dataSubmissionEnabled: false
  datareporting.policy.dataSubmissionPolicyBypassNotification: false
  browser.crashReports.unsubmittedCheck.enabled: false
  browser.crashReports.requestedNeverShowAgain: true
  browser.safebrowsing.downloads.enabled: false
  browser.safebrowsing.downloads.remote.enabled: false
  browser.safebrowsing.malware.enabled: false
  browser.safebrowsing.phishing.enabled: false
  services.settings.server: ""
  services.settings.poll_interval: 2147483647
  services.settings.enabled: false
  extensions.update.enabled: false
  extensions.blocklist.enabled: false
  app.update.enabled: false
  app.normandy.enabled: false
  app.normandy.api_url: ""
  app.shield.optoutstudies.enabled: false
  browser.newtabpage.activity-stream.telemetry: false
  browser.region.network.url: ""
  browser.region.update.enabled: false
  network.captive-portal-service.enabled: false
  network.connectivity-service.enabled: false
  network.trr.mode: 5
  dom.push.enabled: false
  identity.fxaccounts.enabled: false
  signon.rememberSignons: false
  signon.autofillForms: false
  signon.management.page.enabled: false
  geckoview.console.enabled: false
  consoleservice.logcat: false
  devtools.console.stdout.chrome: false
  pdfjs.disabled: true

name: Build Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager --list | awk '/platforms;android-[0-9]+[[:space:]]/ {print $1}' | sort -Vu
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle verified official B612 fonts
        run: python3 scripts/fetch-clock-fonts.py
      - name: Verify supplied warning loop
        run: python3 scripts/check-warning-loop.py
      - name: Build and check
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Show lint details on failure
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Prepare and verify universal APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk mirror.apk
          if unzip -Z1 mirror.apk | grep -E '\.so$'; then
            echo 'Native libraries must not be packaged'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose mirror.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-apk
          path: mirror.apk
      - name: Verify APK version
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging mirror.apk > apk-info.txt
          python3 - <<'PYTHON'
          import pathlib, re
          props = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines() if '=' in line)
          badging = pathlib.Path('apk-info.txt').read_text()
          for key, prop in [('versionName', 'mirrorVersionName'), ('versionCode', 'mirrorVersionCode')]:
              value = re.search(rf"{key}='([^']+)'", badging).group(1)
              assert value == props[prop], (key, value, props[prop])
          print('Verified APK version:', props['mirrorVersionName'], props['mirrorVersionCode'])
          PYTHON
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mirror build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: mirror.apk



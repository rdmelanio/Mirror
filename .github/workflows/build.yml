name: Build Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirror-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager --list | awk '/platforms;android-[0-9]+[[:space:]]/ {print $1}' | sort -Vu
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Fetch checksum-verified official vision models
        run: python3 scripts/fetch-air-model.py
      - name: Bundle verified official B612 fonts
        run: python3 scripts/fetch-clock-fonts.py
      - name: Bundle Inter menu fonts
        run: python3 scripts/fetch-menu-fonts.py
      - name: Verify menu theme and protected clock/alarm styles
        run: python3 scripts/check-phone-theme.py
      - name: Verify supplied warning loop
        run: python3 scripts/check-warning-loop.py
      - name: Verify eCrew automation and no-page-hooks guard
        run: node --test scripts/check-ecrew-extension.cjs
      - name: Build both release APKs
        run: ./gradlew :app:assembleLiteRelease :app:assembleFullRelease
      - name: Test both flavors
        run: ./gradlew :app:testLiteDebugUnitTest :app:testFullDebugUnitTest
      - name: Lint both flavors
        run: ./gradlew :app:lintLiteRelease :app:lintFullRelease
      - name: Report unit test totals
        run: |
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as ET
          for flavor in ('lite', 'full'):
              reports = list(pathlib.Path(f'app/build/test-results/test{flavor.capitalize()}DebugUnitTest').glob('TEST-*.xml'))
              totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
              for report in reports:
                  root = ET.parse(report).getroot()
                  for key in totals:
                      totals[key] += int(root.attrib.get(key, 0))
              assert reports and totals['tests'] > 0, f'{flavor}: missing test reports'
              assert totals['failures'] == totals['errors'] == 0, (flavor, totals)
              print(flavor, totals)
          PYTHON
      - name: Show failed unit test details
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as ET
          for path in pathlib.Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      print(case.attrib.get('classname'), case.attrib.get('name'))
                      print((failure.text or '')[:12000])
          PYTHON
      - name: Show lint details on failure
        if: failure()
        run: find app/build/intermediates/lint_intermediate_text_report -name '*.txt' -exec cat {} +
      - name: Prepare and verify both APKs
        run: |
          cp app/build/outputs/apk/lite/release/app-lite-release.apk mirror.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk mirror-phone.apk
          python3 scripts/check-apk-flavors.py mirror.apk mirror-phone.apk
          for apk in mirror.apk mirror-phone.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk-signature.txt"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$apk-info.txt"
          done
          python3 scripts/check-release-apks.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mirror-apks
          path: |
            mirror.apk
            mirror-phone.apk
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mirror-apks
      - name: Verify downloaded candidate before publishing
        run: |
          python3 scripts/check-apk-flavors.py mirror.apk mirror-phone.apk
          for apk in mirror.apk mirror-phone.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk-signature.txt"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$apk-info.txt"
          done
          python3 scripts/check-release-apks.py
      - name: Refuse to overwrite an existing build tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/build-${{ github.run_number }}"; then
            echo "Build tag already exists; refusing overwrite"
            exit 1
          else
            test "$?" -eq 2
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mirror candidate — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          prerelease: true
          body: |
            ## Mirror 1.12.14 (219) — diagnostic prerelease

            The eCrew calendar adapter is based on privately supplied portal captures. Physical-device login-to-roster acceptance remains unverified; incomplete or unsupported sources retain the last trusted roster.

            - Phone: mirror-phone.apk (arm64 full). TV/32-bit: mirror.apk (universal lite).
            - Import the observed eCrew calendar event schema directly, including multi-leg routes, standby intervals, station-local times and overnight offsets. No Print or PDF is required for the supported initial schedule.
            - Reject incomplete coverage, unknown timezones, ambiguous DST times and contradictory data while retaining the trusted roster.
            - Add remembered-login consent, separate keep/forget sign-out actions, and Save diagnostic ZIP through Android's picker.
            - Include pairing, gesture freshness, watchdog, transaction and browser-auth repairs documented in the audit ledger.
            - Existing application ID and release signing certificate are preserved. No destructive upgrade migration is intended.

            Local verification: 353 lite tests, 363 full tests and 39 extension tests passed; both lint tasks reported zero errors (warnings remain). This release also requires successful CI verification before publication.

            See docs/audit/autoroster-2026-11-11.md for the closure matrix, limitations and device checklist. The private PDF and personal roster data are excluded from source and release assets.

          files: |
            mirror.apk
            mirror-phone.apk


      - name: Verify both public candidate APK downloads
        run: |
          for apk in mirror.apk mirror-phone.apk; do
            curl --fail --location --retry 5 --retry-delay 3 --output "published-$apk" "https://github.com/rdmelanio/Mirror/releases/download/build-${{ github.run_number }}/$apk"
            cmp "$apk" "published-$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "published-$apk" > "$apk-info.txt"
          done
          python3 scripts/check-release-apks.py


name: Build Mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Show lint details on failure
        if: failure()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
          if [ -f "$report" ]; then cat "$report"; fi
      - name: Prepare and verify universal APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk mirror.apk
          if unzip -Z1 mirror.apk | grep -E '\.so$'; then
            echo 'Native libraries must not be packaged'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose mirror.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mirror-apk
          path: mirror.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mirror build ${{ github.run_number }}
          make_latest: true
          files: mirror.apk
